; XIAO ESP32-S3: Wi-Fi web front end for an ESP-SDR XIAO ESP32-C5 (UART link).
; The C5 runs the unmodified ESP-SDR firmware from the browser installer.
[env:xiao_esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; Some USB ports drop the link when esptool raises the baud rate.
upload_speed = 115200
lib_deps =
    links2004/WebSockets@2.4.1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
